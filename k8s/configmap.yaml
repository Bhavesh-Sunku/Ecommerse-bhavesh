apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  JWT_ISSUER: ECommerceAPI
  JWT_AUDIENCE: ECommerceClient
  PRODUCT_SERVICE_URL: http://product-service:8080/
  USER_SERVICE_URL: http://user-service:8080/
  ORDER_SERVICE_URL: http://order-service:8080/
  PAYMENT_SERVICE_URL: http://payment-service:8080/
  ProductService__BaseUrl: http://product-service:8080/
  OrderService__BaseUrl: http://order-service:8080/
  ReverseProxy__Clusters__products__Destinations__destination1__Address: http://product-service:8080/
  ReverseProxy__Clusters__users__Destinations__destination1__Address: http://user-service:8080/
  ReverseProxy__Clusters__orders__Destinations__destination1__Address: http://order-service:8080/
  ReverseProxy__Clusters__payments__Destinations__destination1__Address: http://payment-service:8080/
