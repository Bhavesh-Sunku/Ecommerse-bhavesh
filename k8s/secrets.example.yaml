apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  JWT_KEY: "REPLACE_WITH_AT_LEAST_32_RANDOM_UTF8_BYTES"
  PRODUCT_INTERNAL_SERVICE_KEY: "REPLACE_WITH_A_DISTINCT_RANDOM_SECRET"
  PAYMENT_INTERNAL_SERVICE_KEY: "REPLACE_WITH_ANOTHER_DISTINCT_RANDOM_SECRET"
  PRODUCT_DB_CONNECTION: "Server=tcp:<SQL_SERVER>.database.windows.net,1433;Initial Catalog=ECommerceProducts;User ID=<APP_DB_USER>;Password=<APP_DB_PASSWORD>;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
  USER_DB_CONNECTION: "Server=tcp:<SQL_SERVER>.database.windows.net,1433;Initial Catalog=ECommerceUsers;User ID=<APP_DB_USER>;Password=<APP_DB_PASSWORD>;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
  ORDER_DB_CONNECTION: "Server=tcp:<SQL_SERVER>.database.windows.net,1433;Initial Catalog=ECommerceOrders;User ID=<APP_DB_USER>;Password=<APP_DB_PASSWORD>;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
  PAYMENT_DB_CONNECTION: "Server=tcp:<SQL_SERVER>.database.windows.net,1433;Initial Catalog=ECommercePayments;User ID=<APP_DB_USER>;Password=<APP_DB_PASSWORD>;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
